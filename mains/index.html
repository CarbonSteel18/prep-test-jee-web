<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JEE Main — Previous Year Papers</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>JEE Main</h1>
      <input id="search" type="search" placeholder="Search date or year…" />
      <nav id="tree"></nav>
    </aside>

    <main class="viewer">
      <header class="viewer-head">
        <h2 id="paper-title">Select a paper</h2>
        <a id="dl-btn" class="btn" href="#" target="_blank" rel="noopener" hidden>Download</a>
      </header>
      <iframe id="pdf-frame" allow="autoplay" loading="lazy"
              src="about:blank" title="Paper preview"></iframe>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
